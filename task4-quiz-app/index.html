<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Quiz App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .quiz-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .quiz-header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .question-counter {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-top: 0.5rem;
        }

        .quiz-body {
            padding: 2.5rem;
        }

        .question {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .option {
            padding: 1.25rem 1.5rem;
            background: #f8fafc;
            border: 2px solid transparent;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1rem;
            font-weight: 500;
        }

        .option:hover {
            background: #e0e7ff;
            border-color: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.15);
        }

        .option.selected {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border-color: #4f46e5;
        }

        .next-btn {
            width: 100%;
            padding: 1.25rem;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.6;
        }

        .next-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(16, 185, 129, 0.4);
        }

        .next-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* Results Screen */
        .results {
            text-align: center;
            padding: 3rem 2rem;
        }

        .score {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .score-text {
            font-size: 1.3rem;
            color: #6b7280;
            margin-bottom: 2rem;
        }

        .restart-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
        }

        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.4);
        }

        @media (max-width: 480px) {
            .quiz-container {
                margin: 1rem;
                border-radius: 20px;
            }
            
            .quiz-header,
            .quiz-body {
                padding: 1.5rem;
            }
            
            .question {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container" id="quizContainer">
        <div class="quiz-header">
            <h1></i>Quiz</h1>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="question-counter" id="questionCounter">Question 1 of 5</div>
        </div>

        <div class="quiz-body">
            <!-- Question Screen -->
            <div id="questionScreen">
                <div class="question" id="question"></div>
                <div class="options" id="options"></div>
                <button class="next-btn" id="nextBtn" disabled>Next Question</button>
            </div>

            <!-- Results Screen -->
            <div id="resultsScreen" class="results" style="display: none;">
                <div class="score" id="finalScore">0</div>
                <div class="score-text" id="scoreText"></div>
                <button class="restart-btn" onclick="startQuiz()">
                    <i class="fas fa-redo"></i> Take Quiz Again
                </button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "What is the largest planet in our solar system?",
                options: ["Earth", "Mars", "Jupiter", "Saturn"],
                correct: 2
            },
            {
                question: "Which programming language has the most GitHub stars?",
                options: ["Java", "Python", "JavaScript", "C++"],
                correct: 2
            },
            {
                question: "What year did the first iPhone launch?",
                options: ["2005", "2006", "2007", "2008"],
                correct: 2
            },
            {
                question: "Which element has the chemical symbol 'Au'?",
                options: ["Silver", "Gold", "Iron", "Copper"],
                correct: 1
            },
            {
                question: "How many bones are in the adult human body?",
                options: ["196", "206", "216", "226"],
                correct: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedAnswer = -1;

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const nextBtn = document.getElementById('nextBtn');
        const progressEl = document.getElementById('progress');
        const questionCounterEl = document.getElementById('questionCounter');
        const questionScreen = document.getElementById('questionScreen');
        const resultsScreen = document.getElementById('resultsScreen');
        const finalScoreEl = document.getElementById('finalScore');
        const scoreTextEl = document.getElementById('scoreText');

        function startQuiz() {
            currentQuestion = 0;
            score = 0;
            selectedAnswer = -1;
            questionScreen.style.display = 'block';
            resultsScreen.style.display = 'none';
            nextBtn.disabled = true;
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentQuestion];
            questionEl.textContent = q.question;
            questionCounterEl.textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;

            optionsEl.innerHTML = '';
            q.options.forEach((option, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = option;
                div.onclick = () => selectAnswer(index);
                optionsEl.appendChild(div);
            });

            progressEl.style.width = `${((currentQuestion) / quizData.length) * 100}%`;
            nextBtn.disabled = true;
            selectedAnswer = -1;
        }

        function selectAnswer(index) {
            selectedAnswer = index;
            
            // Update visual selection
            document.querySelectorAll('.option').forEach((opt, i) => {
                opt.classList.toggle('selected', i === index);
            });
            
            nextBtn.disabled = false;
        }

        function nextQuestion() {
            if (selectedAnswer === quizData[currentQuestion].correct) {
                score++;
            }

            currentQuestion++;

            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            questionScreen.style.display = 'none';
            resultsScreen.style.display = 'block';
            
            finalScoreEl.textContent = `${score}/${quizData.length}`;
            const percentage = Math.round((score / quizData.length) * 100);
            
            let text = '';
            if (percentage >= 80) text = '🎉 Outstanding!';
            else if (percentage >= 60) text = '👍 Great job!';
            else if (percentage >= 40) text = '📚 Keep learning!';
            else text = '🔄 Try again!';
            
            scoreTextEl.innerHTML = `${percentage}% - ${text}`;
        }

        // Event Listeners
        nextBtn.onclick = nextQuestion;

        // Start quiz on load
        startQuiz();
    </script>
</body>
</html>
