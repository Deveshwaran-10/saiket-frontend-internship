<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Product Card</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .product-card {
            background: white;
            border-radius: 24px;
            width: 100%;
            max-width: 360px;
            height: 520px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.15);
        }

        .product-image {
            height: 280px;
            position: relative;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .product-card:hover .product-image img {
            transform: scale(1.05);
        }

        .product-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .product-card:hover .product-image::after {
            opacity: 1;
        }

        .product-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 600;
            color: #0f0f0f;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            z-index: 2;
        }

        .product-content {
            padding: 32px 32px 28px;
        }

        .product-category {
            color: #6366f1;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .product-title {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .product-description {
            color: #6b7280;
            font-size: 16px;
            line-height: 1.55;
            margin-bottom: 24px;
        }

        .product-price {
            font-size: 32px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .product-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 20px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #007aff 0%, #0056d2 100%);
            color: white;
            box-shadow: 0 8px 24px rgba(0, 122, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 16px 40px rgba(0, 122, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.8);
            color: #111827;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 0, 0, 0.08);
            font-weight: 500;
        }

        .btn-secondary:hover {
            background: white;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        @media (max-width: 480px) {
            .product-card {
                max-width: 100%;
                height: 500px;
                margin: 0;
            }
            
            .product-image {
                height: 260px;
            }
            
            .product-content {
                padding: 28px 28px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="product-card">
        <div class="product-image">
            <img src="Airpods pro 2.webp" alt="AirPods Pro 2">
            <div class="product-badge">New</div>
        </div>
        <div class="product-content">
            <div class="product-category">Technology</div>
            <h1 class="product-title">AirPods Pro 2</h1>
            <p class="product-description">
                Revolutionary noise cancellation with Active Noise Cancellation 2.0, delivering up to 2x more noise cancellation and Transparency mode.
            </p>
            <div class="product-price">$249</div>
            <div class="product-actions">
                <button class="btn btn-primary">Add to Cart</button>
                <button class="btn btn-secondary">View Details</button>
            </div>
        </div>
    </div>
</body>
</html>
